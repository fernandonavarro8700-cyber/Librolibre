name: Build APK

# Se ejecuta automáticamente al subir cambios a main, y también se puede
# lanzar a mano desde la pestaña "Actions" del repo (botón "Run workflow").
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java (requerido por Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Apache Cordova
        run: npm install -g cordova

      - name: Agregar la plataforma Android
        run: cordova platform add android

      - name: Compilar la APK (debug, sin firmar)
        run: cordova build android --no-telemetry

      - name: Subir la APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: LibroLibre-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
